name: Build on GitHub

on:
  push:
    branches:
      - master
      - refactor-vanilla-es-modules
      - vpat_fixes
  workflow_dispatch:

# NB the fork's Actions default is read-only: the deploy step needs
# write access to push the gh-pages branch
permissions:
  contents: write

jobs:
  build-then-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run per se
        run: python3 deploy/build_js.py
        shell: bash

      - name: Save files
        run: |
          mkdir dist
          cp ermac.min.js dist
          cp -r webassets oauth crystvis labs dist
          cp example_prod.html dist/index.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
