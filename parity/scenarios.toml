steps = [ { wait = 5000 } ]
probe = ["visible:#tooltip", "js:wmgui.tooltip_counter"]
tags = ["storage", "tooltip"]

[[scenario]]
name = "darkmode_restored"
route = "#start"
storage = { darkmode = "true" }
probe = ["text:#darkmode_trigger", "class:body"]
pixels = "loose"
tags = ["storage", "darkmode"]

# ============================================================================
# API failure paths (mocked)
# ============================================================================

[[scenario]]
name = "api_search_error_message"
desc = "a search answered with an error object"
route = "#inquiry/elements=Ag-O"
mock = [ { path = "/search/facet", json = { error = "Sorry, the search is too broad" } } ]
tags = ["mock", "notify"]

[[scenario]]
name = "api_search_unreachable"
desc = "the search endpoint down: 'connection lost' handling"
route = "#inquiry/elements=Ag-O"
mock = [ { path = "/search/facet", abort = true } ]
tags = ["mock", "notify"]

[[scenario]]
name = "api_search_http_500"
route = "#inquiry/elements=Ag-O"
mock = [ { path = "/search/facet", status = 500, body = "Internal Server Error" } ]
tags = ["mock", "notify"]

[[scenario]]
name = "api_search_empty"
desc = "zero results"
route = "#inquiry/elements=Ag-O"
mock = [ { path = "/search/facet", json = { out = [], total_count = 0, error = false } } ]
tags = ["mock"]

[[scenario]]
name = "api_autocomplete_down"
desc = "typing while the suggestion endpoint is down"
route = "#start"
mock = [ { path = "/search/selectize", abort = true } ]
steps = [ { type = "#search_field-selectized", text = "Ag", after = 1500 } ]
tags = ["mock", "multiselect"]

# ============================================================================
# absolute expectations (`expect`: checked on EACH side, not only old vs new)
# ============================================================================

[[scenario]]
name = "search_ru_am_has_hits"
desc = "Ru and Am together do have hits (8 entries as recorded on 2026-10-23)"
route = "#search/Ru-Am"
probe = ["texts:#search_holder .selectize-input > div[data-term]"]
expect = { "count:#databrowser tr.tcell, #databrowser div.gallery_item" = { gt = 0 }, "title" = { matches = '^\d+ results?$' } }
tags = ["search", "expect"]

[[scenario]]
name = "search_am_ru_binary_similar"
desc = "free text 'Am Ru binary': no exact binary Am-Ru, the server's 'similar data shown' notice is displayed"
route = "#start"
steps = [
  { type = "#search_field-selectized", text = "Am Ru binary", after = 300 },
  { key = "Enter", after = 1500 },
]
settle = 1000  # NB the notification hides 4 s after it appears
tags = ["search", "notify", "expect"]

[scenario.expect]
"text:#notifybox" = { contains = "similar data shown" }
"visible:#notifybox" = true
"hash" = "#inquiry/elements=Am-Ru&classes=binary"

