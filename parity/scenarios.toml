# Ermac parity scenarios. See parity/README.md ("Adding a parity test").
#
# Every [[scenario]] runs on the OLD and the NEW bundle under identical,
# deterministic conditions; all layers (api, ext, dom, probes, steps, errors,
# pixels) must agree. A scenario is: a route + optional steps + optional probes.

[defaults]
boot = 3000          # virtual ms after page load, before the first step
step_after = 400     # virtual ms after each step
settle = 3000        # virtual ms after the last step, before the capture
pixels = "strict"
# NB these probes are evaluated in EVERY scenario (cheap, broad UX invariants)
probe = [
  "hash", "title", "focus",
  "text:#notifybox", "visible:#notifybox",
  "texts:#search_holder .selectize-input > div[data-term]",
  "value:#search_field-selectized",
  "visible:#search_holder .selectize-dropdown",
  "nvisible:div.modal",
  "visible:#overlay",
  "js:wmgui.view_mode", "js:wmgui.search_type", "js:wmgui.search",
  "js:Object.keys(localStorage).sort()",
]

[[fixture]]
name = "phid"
route = "#inquiry_phases/elements=Ag-O&classes=oxide"
probe = "attr:#databrowser div.gallery_img@rel"

[[fixture]]
name = "bid"
route = "#search/Ag-O"
pattern = 'ref_id=(\d+)&amp;sid'

